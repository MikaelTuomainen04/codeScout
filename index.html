<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>codeScout</title>

    <Link rel="stylesheet" href="styles.css">

</head>
<body>

    <header>

        <h1>codeScout</h1>

        <p>Find real-world open-source projects to learn from other developpers</p>
        <p>Find code written by developers.</p>
        <p>Learn how other developers solve problems.</p>

    </header>

    <main id="pääosio">

        <section>

        <form action="">

        <label for="search">What do you want to learn?</label>
        <input name="query" type="search" id="search">

        <label for="language">Language:</label>

            <select name="language" id="language">
                    <option value="">--Any language--</option>
                    <option value="Ada">Ada</option>
                    <option value="Assembly">Assembly</option>
                    <option value="C">C</option>
                    <option value="C#">C#</option>
                    <option value="C++">C++</option>
                    <option value="COBOL">COBOL</option>
                    <option value="Dart">Dart</option>
                    <option value="Elixir">Elixir</option>
                    <option value="Erlang">Erlang</option>
                    <option value="F#">F#</option>
                    <option value="Fortran">Fortran</option>
                    <option value="Go">Go</option>
                    <option value="Haskell">Haskell</option>
                    <option value="Java">Java</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Julia">Julia</option>
                    <option value="Kotlin">Kotlin</option>
                    <option value="Lisp">Lisp</option>
                    <option value="Lua">Lua</option>
                    <option value="MATLAB">MATLAB</option>
                    <option value="Objective-C">Objective-C</option>
                    <option value="OCaml">OCaml</option>
                    <option value="Pascal">Pascal</option>
                    <option value="Perl">Perl</option>
                    <option value="PHP">PHP</option>
                    <option value="PowerShell">PowerShell</option>
                    <option value="Prolog">Prolog</option>
                    <option value="Python">Python</option>
                    <option value="R">R</option>
                    <option value="Ruby">Ruby</option>
                    <option value="Rust">Rust</option>
                    <option value="Scala">Scala</option>
                    <option value="SQL">SQL</option>
                    <option value="Swift">Swift</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="Visual Basic">Visual Basic</option>
                    <option value="Zig">Zig</option>
                </select>

                <button type="submit">Search</button>

            

            <section>

            <div>
            
            <label for="search-summary">Search summary:</label>
            <p id="search-summary"></p>
            
            </div>

    </main>

    <footer>
        <p>&copy; Mikael Tuomainen codeScout</p>
    </footer>

<script src="script.js"></script>

</body>
</html>
